<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Todo Application</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

  <style>

    body {
      background: #f5f7fb;
      font-family: Arial, sans-serif;
    }

    .todo-container {
      max-width: 900px;
      margin: 60px auto;
    }

    .todo-header {
      text-align: center;
      margin-bottom: 35px;
    }

    .todo-header h1 {
      font-size: 42px;
      font-weight: 700;
      color: #212529;
    }

    .todo-header p {
      color: #6c757d;
      font-size: 16px;
      margin-top: 8px;
    }

    /* Add task section */
    .add-task-box {
      background: #dbeafe;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
      margin-bottom: 25px;
    }

    .task-input {
      height: 52px;
      border-radius: 10px;
      border: 1px solid #dee2e6;
      padding-left: 16px;
      font-size: 16px;
    }

    .task-input:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.1);
    }

    .add-btn {
      height: 52px;
      border-radius: 10px;
      font-weight: 600;
      width: 100%;
    }

    /* Task cards */
    .task-card {
      background: white;
      border: none;
      border-radius: 14px;
      margin-bottom: 12px;
      padding: 4px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.05);
      transition: all 0.2s ease;
    }

    .task-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    }

    .task-title {
      font-size: 17px;
      font-weight: 500;
      color: #212529;
    }

    .task-actions {
      display: flex;
      gap: 8px;
    }

    .toggle-btn {
      border-radius: 8px;
      padding: 7px 14px;
    }

    .delete-btn {
      border-radius: 8px;
      padding: 7px 14px;
    }

    .completed-task {
      color: #6c757d !important;
    }

    /* Empty space / task list */
    .task-list {
      margin-top: 10px;
    }

  </style>
</head>

<body>

<div class="container todo-container">

  <!-- Header -->
  <div class="todo-header">
    <h1>To-Do Application</h1>
    <p>Stay organized and get things done.</p>
  </div>


  <!-- Add Task -->
  <div class="add-task-box">

    <form action="/" method="post" class="row g-3">

      <div class="col-md-9">
        <input
            class="form-control task-input"
            type="text"
            name="title"
            placeholder="What needs to be done?"
            required>
      </div>

      <div class="col-md-3">
        <button
            type="submit"
            class="btn btn-primary add-btn">
          + Add Task
        </button>
      </div>

    </form>

  </div>


  <!-- Tasks -->
  <div class="task-list">

    <th:block th:each="task : ${tasks}">

      <div class="card task-card">

        <div class="card-body d-flex justify-content-between align-items-center">

          <!-- Task title -->
          <span
              class="task-title"
              th:classappend="${task.completed ? 'text-decoration-line-through completed-task' : ''}"
              th:text="${task.title}">
                        Task Title
                    </span>


          <!-- Buttons -->
          <div class="task-actions">

            <a
                th:href="@{/{id}/toggle(id=${task.id})}"
                class="btn btn-outline-success btn-sm toggle-btn">
              Toggle
            </a>

            <a
                th:href="@{/{id}/delete(id=${task.id})}"
                class="btn btn-outline-danger btn-sm delete-btn">
              Delete
            </a>

          </div>

        </div>

      </div>

    </th:block>

  </div>

</div>

</body>
</html>
